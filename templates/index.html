<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Transcriber & Analyzer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .input-group {
            margin-bottom: 30px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }
        
        .url-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .url-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        button {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results {
            display: none;
        }
        
        .results.active {
            display: block;
        }
        
        .result-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .result-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .transcript-box {
            max-height: 300px;
            overflow-y: auto;
            padding: 15px;
            background: white;
            border-radius: 8px;
            line-height: 1.6;
        }
        
        .insights-box {
            padding: 15px;
            background: white;
            border-radius: 8px;
            line-height: 1.8;
        }
        
        .insights-box h3 {
            color: #764ba2;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        
        .insights-box ul {
            margin-left: 20px;
        }
        
        .insights-box li {
            margin-bottom: 8px;
        }
        
        .error {
            display: none;
            padding: 15px;
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 8px;
            color: #c00;
            margin-bottom: 20px;
        }
        
        .error.active {
            display: block;
        }
        
        .options {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .copy-btn {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .copy-btn:hover {
            background: #5a67d8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ Podcast Transcriber & Analyzer</h1>
            <p>YouTube-Podcasts transkribieren und Key Insights extrahieren</p>
        </div>
        
        <div class="content">
            <div class="input-group">
                <label for="url">YouTube URL eingeben:</label>
                <input 
                    type="url" 
                    id="url" 
                    class="url-input" 
                    placeholder="https://www.youtube.com/watch?v=..."
                >
            </div>
            
            <div class="options">
                <div class="option">
                    <input type="radio" id="use-claude" name="ai-model" value="claude" checked>
                    <label for="use-claude">Claude (Haiku)</label>
                </div>
                <div class="option">
                    <input type="radio" id="use-gpt" name="ai-model" value="gpt">
                    <label for="use-gpt">GPT-4o-mini</label>
                </div>
            </div>
            
            <div class="buttons">
                <button class="btn-primary" onclick="processComplete()">
                    Transkribieren & Analysieren
                </button>
                <button class="btn-secondary" onclick="transcribeOnly()">
                    Nur Transkribieren
                </button>
            </div>
            
            <div class="error" id="error"></div>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p id="loading-text">Verarbeite Podcast...</p>
            </div>
            
            <div class="results" id="results">
                <div class="result-section">
                    <h2>📝 Transkript</h2>
                    <div class="transcript-box" id="transcript"></div>
                    <button class="copy-btn" onclick="copyTranscript()" style="margin-top: 10px;">
                        Transkript kopieren
                    </button>
                </div>
                
                <div class="result-section" id="insights-section" style="display: none;">
                    <h2>💡 Key Insights & Learnings</h2>
                    <div class="insights-box" id="insights"></div>
                    <button class="copy-btn" onclick="copyInsights()" style="margin-top: 10px;">
                        Insights kopieren
                    </button>
                </div>
                
                <button class="btn-secondary" onclick="analyzeExisting()" id="analyze-btn" style="display: none;">
                    Insights generieren
                </button>
            </div>
        </div>
    </div>
    
    <script>
        let currentTranscript = '';
        let currentInsights = '';
        
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('active');
            setTimeout(() => errorEl.classList.remove('active'), 5000);
        }
        
        function showLoading(text) {
            document.getElementById('loading').classList.add('active');
            document.getElementById('loading-text').textContent = text;
        }
        
        function hideLoading() {
            document.getElementById('loading').classList.remove('active');
        }
        
        async function processComplete() {
            const url = document.getElementById('url').value;
            if (!url) {
                showError('Bitte gib eine YouTube URL ein');
                return;
            }
            
            showLoading('Lade Audio herunter...');
            document.getElementById('results').classList.remove('active');
            
            try {
                // Status-Updates simulieren
                setTimeout(() => {
                    document.getElementById('loading-text').textContent = 'Transkribiere Audio...';
                }, 3000);
                
                setTimeout(() => {
                    document.getElementById('loading-text').textContent = 'Extrahiere Insights...';
                }, 10000);
                
                const response = await fetch('/process', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        url: url,
                        use_claude: document.getElementById('use-claude').checked
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Fehler bei der Verarbeitung');
                }
                
                displayResults(data);
            } catch (error) {
                showError(error.message);
            } finally {
                hideLoading();
            }
        }
        
        async function transcribeOnly() {
            const url = document.getElementById('url').value;
            if (!url) {
                showError('Bitte gib eine YouTube URL ein');
                return;
            }
            
            showLoading('Lade Audio herunter...');
            document.getElementById('results').classList.remove('active');
            
            try {
                setTimeout(() => {
                    document.getElementById('loading-text').textContent = 'Transkribiere Audio...';
                }, 3000);
                
                const response = await fetch('/transcribe-only', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url: url})
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Fehler bei der Transkription');
                }
                
                displayResults(data, true);
            } catch (error) {
                showError(error.message);
            } finally {
                hideLoading();
            }
        }
        
        async function analyzeExisting() {
            if (!currentTranscript) {
                showError('Kein Transkript vorhanden');
                return;
            }
            
            showLoading('Analysiere Transkript...');
            
            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        transcript: currentTranscript,
                        use_claude: document.getElementById('use-claude').checked
                    })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Fehler bei der Analyse');
                }
                
                currentInsights = data.insights;
                document.getElementById('insights').innerHTML = marked.parse(data.insights);
                document.getElementById('insights-section').style.display = 'block';
                document.getElementById('analyze-btn').style.display = 'none';
            } catch (error) {
                showError(error.message);
            } finally {
                hideLoading();
            }
        }
        
        function displayResults(data, transcriptOnly = false) {
            currentTranscript = data.transcript;
            
            document.getElementById('transcript').textContent = data.transcript;
            
            if (data.insights && !transcriptOnly) {
                currentInsights = data.insights;
                document.getElementById('insights').innerHTML = marked.parse(data.insights);
                document.getElementById('insights-section').style.display = 'block';
                document.getElementById('analyze-btn').style.display = 'none';
            } else {
                document.getElementById('insights-section').style.display = 'none';
                document.getElementById('analyze-btn').style.display = 'block';
            }
            
            document.getElementById('results').classList.add('active');
        }
        
        function copyTranscript() {
            navigator.clipboard.writeText(currentTranscript);
            alert('Transkript kopiert!');
        }
        
        function copyInsights() {
            navigator.clipboard.writeText(currentInsights);
            alert('Insights kopiert!');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</body>
</html>
